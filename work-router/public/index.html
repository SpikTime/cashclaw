<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>CashClaw</title><link rel="stylesheet" href="/app.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/app.js" defer></script></head><body><main>
<header><div><p class="eyebrow">WORK ROUTER</p><h1>CashClaw</h1></div><span id="connection" class="connection"><i></i> Загружается</span></header>
<nav class="tabs"><button class="tab active" data-view="jobs">Задачи</button><button class="tab" data-view="sources">Источники</button></nav>
<section id="jobs-view"><section class="summary"><div><strong id="total">0</strong><span>объявлений</span></div><div><strong id="active">0</strong><span>в обработке</span></div><div><strong id="best">—</strong><span>лучший балл</span></div></section><section class="section-head"><div><h2>Возможности</h2><p>Статусы обновляются автоматически</p></div><button id="refresh" type="button">Обновить</button></section><div id="cycle" class="cycle"></div><div id="error" class="error" role="alert" hidden></div><div id="jobs" class="jobs"><article class="card skeleton"><span></span><span></span><span></span></article></div></section>
<section id="sources-view" hidden><section class="section-head"><div><h2>Источники</h2><p>Публичный режим без входа в Telegram</p></div><button id="run-cycle" type="button">Проверить все</button></section><form id="add-source" class="add-source"><input id="source-username" required maxlength="33" placeholder="@username" aria-label="Имя Telegram-канала"><button type="submit">Добавить</button></form><div id="source-error" class="error" hidden></div><div id="sources" class="sources"><article class="card skeleton"><span></span><span></span></article></div></section>
</main></body></html>
